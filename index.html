<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>InstaWeb AI - Dashboard</title>
    <style>
        body { font-family: 'SF Arabic', sans-serif; background: #f4f7f6; padding: 20px; }
        #app-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        button#generate-btn { padding: 12px 25px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #preview-area { margin-top: 30px; padding: 20px; border: 2px dashed #3b82f6; min-height: 200px; border-radius: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <h1>مولد المواقع InstaWeb AI 🚀</h1>
    <p>اكتب ما تريد تصميمه (مثال: زر أحمر "موافق"):</p>
    
    <input type="text" id="user-prompt" placeholder="مثلاً: بطاقة زرقاء...">
    <button id="generate-btn">توليد</button>

    <div id="preview-area">
        </div>
</div>

<script src="dictionary.js"></script>
<script src="engine.js"></script>
</body>
</html>
