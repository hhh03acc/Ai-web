<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaWeb AI | محرك بناء المواقع الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-text {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="glass-effect sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="text-2xl font-bold gradient-text">InstaWeb AI</div>
        <div class="flex gap-4">
            <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded-full font-mono">v3.2.1-PRO</span>
            <span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded-full font-mono">Ali Dev Build</span>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl">
        
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">ماذا تريد أن تبني اليوم؟</h1>
            <p class="text-gray-600">اكتب وصفاً قصيراً وسيقوم محركنا بتحويله إلى واجهة برمجية كاملة.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 mb-12 border border-gray-100">
            <div class="relative">
                <textarea 
                    id="user-prompt" 
                    rows="3" 
                    class="w-full p-4 text-lg border-2 border-gray-100 rounded-xl focus:border-blue-500 focus:ring-0 transition-all outline-none resize-none"
                    placeholder="مثال: صمم لي واجهة احترافية مع شريط تنقل باللون الأزرق..."
                ></textarea>
                <button 
                    id="generate-btn" 
                    class="absolute bottom-4 left-4 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold transition-all transform active:scale-95 shadow-lg"
                >
                    توليد الموقع
                </button>
            </div>
            
            <div class="mt-4 flex flex-wrap gap-2">
                <button onclick="document.getElementById('user-prompt').value='أنشئ بطاقة عرض منتج عصرية'" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-md transition-colors border border-gray-200">+ بطاقة منتج</button>
                <button onclick="document.getElementById('user-prompt').value='صمم قسم Hero مع خلفية داكنة'" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-md transition-colors border border-gray-200">+ قسم ترحيبي</button>
                <button onclick="document.getElementById('user-prompt').value='أضف نموذج اتصال بسيط'" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-md transition-colors border border-gray-200">+ نموذج اتصال</button>
            </div>
        </div>

        <div id="output-container" class="min-h-[200px] bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200 flex items-center justify-center relative overflow-hidden">
            <div class="text-gray-400 flex flex-col items-center">
                <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span>المعاينة ستظهر هنا بعد التوليد</span>
            </div>
        </div>

    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 InstaWeb AI - تم التطوير بواسطة <span class="font-bold text-blue-600">Ali</span></p>
    </footer>

    <script src="js/dictionary.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/engine.js"></script>

</body>
</html>
